<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <!-- Tile in the app's indigo brand colour -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Three placed blocks -->
  <rect x="7" y="16" width="8" height="8" rx="2" fill="#fff"/>
  <rect x="17" y="16" width="8" height="8" rx="2" fill="#fff"/>
  <rect x="7" y="6" width="8" height="8" rx="2" fill="#fff" fill-opacity="0.85"/>
  <!-- The block being dragged into place -->
  <rect x="18" y="5" width="8" height="8" rx="2" fill="#fbbf24" transform="rotate(12 22 9)"/>
</svg>
